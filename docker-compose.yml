services:
  mongo:
    image: mongo:8.0
    container_name: forgeflow-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-forgeflow}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - forgeflow-network

  backend:
    build:
      context: ./etl-backend
      dockerfile: Dockerfile
    container_name: forgeflow-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/forgeflow}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - forgeflow-network

volumes:
  mongo_data:
    name: forgeflow_mongo_data
    driver: local

networks:
  forgeflow-network:
    name: forgeflow_network
    driver: bridge
